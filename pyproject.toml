[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaste"
version = "0.1.0-b1"
description = "A CLI tool that watches files and automatically uploads changes to paste.c-net.org"
dependencies = ["requests>=2.25.0"]


[project.scripts]
autopaste = "autopaste.cli:main"
