[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaste"
version = "1.0.1"
description = "A lightweight CLI utility for uploading text, files, and stdin to paste.c-net.org"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "DJ KAIF", email = "djkaifdev@gmail.com" }
]

keywords = [
"paste",
"pastebin",
"cli",
"terminal",
"upload"
]

classifiers = [
"Development Status :: 5 - Production/Stable",
"Environment :: Console",
"Intended Audience :: Developers",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.8",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: Internet",
"Topic :: Utilities"
]

dependencies = [
"requests>=2.25.0"
]

[project.urls]
Homepage = "https://github.com/dj-kaif/autopaste"
Repository = "https://github.com/dj-kaif/autopaste"
Issues = "https://github.com/dj-kaif/autopaste/issues"

[project.scripts]
autopaste = "autopaste.cli:main"